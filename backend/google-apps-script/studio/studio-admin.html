<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: #202124;
      background: #fff;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    p {
      margin: 0 0 18px;
      color: #5f6368;
      font-size: 13px;
      line-height: 1.45;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 600;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #dadce0;
      border-radius: 7px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #5f6368;
      box-shadow: 0 0 0 2px rgba(95, 99, 104, .12);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 14px;
      border: 0;
      border-radius: 7px;
      background: #202124;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .55;
      cursor: default;
    }
    #message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.4;
    }
    .note {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h2>AULIA · Docentes</h2>
  <p>Creá o restablecé el acceso de un docente. La contraseña se usa solo durante esta operación y no se guarda en la planilla.</p>

  <form id="teacherForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="off" required>

    <label for="name">Nombre</label>
    <input id="name" type="text" autocomplete="off" required>

    <label for="password">Contraseña inicial</label>
    <input id="password" type="password" autocomplete="new-password" minlength="10" required>

    <label for="passwordConfirm">Repetir contraseña</label>
    <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="10" required>

    <button id="submit" type="submit">Crear / actualizar acceso</button>
  </form>

  <div id="message"></div>

  <div class="note">
    Para habilitar o deshabilitar un docente existente, seleccioná su fila en
    <strong>👩‍🏫 Docentes</strong> y usá el menú <strong>AULIA</strong>.
  </div>

  <script>
    const form = document.getElementById("teacherForm");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const payload = {
        email: document.getElementById("email").value,
        name: document.getElementById("name").value,
        password: document.getElementById("password").value,
        passwordConfirm: document.getElementById("passwordConfirm").value,
      };

      message.textContent = "Guardando...";
      button.disabled = true;

      google.script.run
        .withSuccessHandler(function(result) {
          message.textContent = result && result.updated
            ? "Acceso actualizado correctamente para " + result.email + "."
            : "Docente creado correctamente: " + result.email + ".";
          form.reset();
          button.disabled = false;
        })
        .withFailureHandler(function(error) {
          message.textContent = "Error: " + (error && error.message ? error.message : error);
          button.disabled = false;
        })
        .createTeacherFromAdmin(payload);
    });
  </script>
</body>
</html>
